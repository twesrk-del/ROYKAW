<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>109 cash</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBF1EE;--card:#fff;--ink:#10302A;--mute:#556B64;--line:#D3DFDA;--pine:#0E3B34;--coin:#FFC93C;--inc:#14804F;--exp:#D94A36;--chip:#F1F5F3;--ac:#0E3B34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081B18;--card:#112B26;--ink:#EEF6F2;--mute:#9DB5AC;--line:#1F3E38;--pine:#0A2823;--chip:#17352F;--inc:#4FD39B;--exp:#FF8B78}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;display:flex;justify-content:center}
body.lg .scroll{zoom:1.14}
.app{width:100%;max-width:430px;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 112px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:700;font-size:21px;letter-spacing:-.5px}.logo b{background:var(--coin);color:#10302A;border-radius:8px;padding:0 7px;margin-right:6px}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:4px 12px 4px 4px;font-size:14px;font-weight:500}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:18px;flex:none}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mon button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:18px}
.mon b{font-size:17px}
.hero{background:var(--pine);color:#fff;border-radius:28px;padding:22px;position:relative;overflow:hidden}
.hero:after{content:"109";position:absolute;right:-8px;bottom:-34px;font-size:120px;font-weight:700;color:rgba(255,201,60,.09);letter-spacing:-6px}
.hero small{opacity:.8;font-size:14px}
.bal{font-size:40px;font-weight:700;letter-spacing:-1px;margin:2px 0 16px}
.row2{display:flex;gap:10px;position:relative;z-index:1}
.pill{flex:1;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.pill div{font-size:13px;opacity:.8}.pill p{font-weight:600;font-size:17px;margin-top:2px}
.pill.i p{color:#7BE3B3}.pill.e p{color:#FFA797}
.sec{margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:18px;font-weight:600}.sec span{font-size:14px;color:var(--mute)}
.card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--line)}
.empty{text-align:center;padding:26px 16px}.empty .e1{font-size:42px}.empty b{display:block;font-size:17px;margin:6px 0 4px}.empty p{color:var(--mute);font-size:14px;margin-bottom:14px}
.btn{border:0;background:var(--coin);color:#10302A;font-weight:600;font-size:16px;padding:14px 22px;border-radius:16px;min-height:48px}
.btn.s{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--exp);color:#fff}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{width:132px;height:132px;flex:none}
.leg{flex:1;min-width:0;font-size:13px}
.leg div{display:flex;align-items:center;gap:7px;padding:4px 0}.leg i{width:12px;height:12px;border-radius:4px;flex:none}.leg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leg b{font-weight:600}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--mute)}
.bars .p{display:flex;gap:3px;align-items:flex-end;height:96px;width:100%;justify-content:center}
.bars .p i{width:42%;max-width:18px;border-radius:6px 6px 2px 2px;display:block;min-height:3px}
.bars .p .a{background:var(--inc)}.bars .p .b{background:var(--exp);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 3px,transparent 3px 6px)}
.bars .on{color:var(--ink);font-weight:600}
.key{display:flex;gap:16px;font-size:13px;margin-top:10px;color:var(--mute)}.key i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);padding:9px 16px;border-radius:14px;font-size:14px;min-height:44px}
.chips button.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;padding:0 4px 8px}
td{padding:11px 4px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}td.n small{display:block;color:var(--mute);font-size:12px}
.i{color:var(--inc)}.e{color:var(--exp)}
.x{border:0;background:var(--chip);width:36px;height:36px;border-radius:10px;font-size:14px}
.bar{height:11px;border-radius:9px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--inc)}.bar i.w{background:#E9A800}.bar i.o{background:var(--exp)}
.bl{padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}.bl:first-child{border:0}
.bl .h{display:flex;justify-content:space-between;font-size:15px}.bl small{color:var(--mute);font-size:13px}
.goal{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.goal:first-child{border:0}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:14px}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.goal .m{flex:1;min-width:0}.goal b{font-size:16px;font-weight:600}.goal small{display:block;color:var(--mute);font-size:13px;margin:2px 0 6px}
.sheet{position:absolute;inset:0;background:rgba(5,20,17,.55);display:none;align-items:flex-end;z-index:5}.sheet.show{display:flex}
.sheet[data-d="0"]{align-items:center;padding:14px;background:var(--bg)}.sheet[data-d="0"] .panel{border-radius:28px;border:1px solid var(--line);max-height:100%}.panel{width:100%;max-height:94%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel h3{font-size:19px;margin-bottom:12px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;color:var(--mute);min-height:44px}.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.big{font-size:44px;font-weight:700;text-align:center;margin:2px 0 8px;letter-spacing:-1px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.cats button,.opt button{flex:none;border:1.5px solid var(--line);background:var(--chip);font-size:14px;padding:9px 13px;border-radius:14px;min-height:44px}
.cats button.on,.opt button.on{border-color:var(--pine);background:var(--pine);color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:0;background:var(--chip);font-size:22px;font-weight:500;padding:12px;border-radius:16px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);margin-bottom:10px;min-height:48px}
label{display:block;font-size:13px;color:var(--mute);margin:2px 2px 4px}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.opt .c{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid transparent}.opt .c.on{border-color:var(--ink)}
.pr{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:var(--chip);border-radius:16px;padding:10px;margin-bottom:8px;text-align:left}.pr.on{border-color:var(--ink)}
.full{width:100%;margin-top:10px}
.toast{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pine);color:#fff;font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:9;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{font-size:12px;color:var(--mute);text-align:center;font-weight:500;padding-bottom:2px}
.cd{border:0;background:var(--chip);border-radius:10px;min-height:56px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:13px}
.cd.h{background:rgba(255,201,60,.3)}.cd small{font-size:10px;line-height:1.2;font-weight:600}
.bars.w .p i{width:60%;max-width:34px}.bars small{color:var(--ink);font-size:11px}
textarea{width:100%;height:180px;font:12px monospace;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink)}
.gate{position:absolute;inset:0;z-index:4;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:16px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;font-weight:600;min-height:130px;justify-content:center}
.pcard.last{border-color:var(--ink)}.pcard .av{width:72px;height:72px;font-size:36px}
.dots{display:flex;gap:16px;margin:18px 0}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}.dots i.f{background:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(3,78px);gap:12px;justify-content:center}.kp button{height:66px;border-radius:50%;border:0;background:var(--card);font-size:26px;font-weight:500;border:1px solid var(--line)}
.syn{position:absolute;left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 8px;z-index:3;pointer-events:none}.syn:empty{display:none}
.nav{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 4px;box-shadow:0 8px 24px rgba(8,40,35,.10)}
.nav button{background:none;border:0;color:var(--mute);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;border-radius:16px;min-height:54px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:after{content:"";width:16px;height:3px;border-radius:3px}
.nav button.on{color:var(--ink);font-weight:600}.nav button.on:after{background:var(--coin)}
.nav .add{width:52px;height:52px;min-height:0;border-radius:18px;background:var(--coin);color:#10302A;justify-self:center;margin-top:-22px;box-shadow:0 6px 16px rgba(255,201,60,.45);padding:0;justify-content:center}
.nav .add:after{display:none}.nav .add svg{width:26px;height:26px;stroke-width:2.2}
</style>
</head>
<body>
<div class="app">
  <div class="toast" id="toast" role="status"></div>
  <div class="scroll" id="main"></div>
  <nav class="nav" aria-label="เมนูหลัก">
    <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>หน้าหลัก</button>
    <button data-v="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>รายการ</button>
    <button class="add" id="addBtn" aria-label="เพิ่มรายการ"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-v="budget"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>งบ</button>
    <button data-v="sum"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>สรุปผล</button>
  </nav>
  <div class="gate" id="gate"></div><div class="syn" id="syn" role="status"></div><div class="sheet" id="sheet"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
</div>
<script>
const CE=[['🍜','อาหาร'],['🚗','เดินทาง'],['🛍️','ช้อปปิ้ง'],['🏠','ที่พัก'],['💡','ค่าน้ำไฟ'],['🎬','บันเทิง'],['💊','สุขภาพ'],['📦','อื่นๆ']];
const CI=[['💼','เงินเดือน'],['🎁','โบนัส'],['📈','รายได้เสริม'],['💰','อื่นๆ']];
const COL=['#0E3B34','#E9A800','#D94A36','#2B7BB9','#8A5AC8','#14804F','#C2527A','#7A8A84'];
const EM=['😀','🦊','🐼','🐱','🌸','⚽'],TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $=s=>document.querySelector(s),f=n=>Number(n).toLocaleString('th-TH'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let UI={lg:0,last:''};try{UI=Object.assign(UI,JSON.parse(localStorage.getItem('c109ui')||'{}'))}catch(e){}
const S=UI,saveUI=()=>{try{localStorage.setItem('c109ui',JSON.stringify(UI))}catch(e){}};
let A=null,KEY=null,PL=[],DB=null,W={},CT={},dirty=false,syncing=false,st=0,unM=null,GS='load',sel='',pb='',fails=0,until=0,busy=false,hid=0;
const P=()=>A,setSync=t=>{const s=$('#syn');if(s)s.textContent=t};
const save=()=>{dirty=true;setSync('⏳ รอบันทึก…');clearTimeout(st);st=setTimeout(sync,700)};
let sref='',view='home',M=iso(new Date()).slice(0,7),flt='all',type='e',amt='',cat='อาหาร',dt='';
const ic=c=>{const l=CE.concat(CI).find(x=>x[1]==c);return l?l[0]:'💰'};
const mlabel=m=>TM[+m.slice(5)-1]+' '+(+m.slice(0,4)+543);
const dlabel=d=>(+d.slice(8))+' '+TM[+d.slice(5,7)-1];
const inM=(p,m)=>p.tx.filter(x=>x.d.slice(0,7)==m);
const sum=(l,t)=>l.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function open(h,dis=true){$('#panel').innerHTML=h;$('#sheet').classList.add('show');$('#sheet').dataset.d=dis?1:0}
function close(){$('#sheet').classList.remove('show')}
$('#sheet').onclick=e=>{if(e.target.id=='sheet'&&e.target.dataset.d=='1')close()};
document.body.classList.toggle('lg',!!S.lg);

function row(x,del){return `<tr><td class="n">${ic(x.c)} ${esc(x.n||x.c)}<small>${esc(x.c)} · ${dlabel(x.d)}</small></td><td class="r ${x.t}"><b>${x.t=='i'?'+':'−'}${f(x.a)}</b></td>${del?`<td class="r"><button class="x" aria-label="ลบรายการ ${esc(x.n||x.c)}" data-del="${x.id}">✕</button></td>`:''}</tr>`}
function mon(){return `<div class="mon"><button data-m="-1" aria-label="เดือนก่อนหน้า">‹</button><b>${mlabel(M)}</b><button data-m="1" aria-label="เดือนถัดไป">›</button></div>`}
function emptyBox(t,s,b){return `<div class="card empty"><div class="e1">🪙</div><b>${t}</b><p>${s}</p>${b?`<button class="btn" data-add>${b}</button>`:''}</div>`}

function donut(l){const by={};l.filter(x=>x.t=='e').forEach(x=>by[x.c]=(by[x.c]||0)+x.a);const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]),tot=ks.reduce((a,k)=>a+by[k],0);
if(!tot)return emptyBox('ยังไม่มีรายจ่ายเดือนนี้','กราฟสัดส่วนจะแสดงที่นี่',0);
let off=25,seg='';ks.forEach((k,i)=>{const p=by[k]/tot*100;seg+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i%8]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p});
return `<div class="card"><div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="สัดส่วนรายจ่ายตามหมวด"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--chip)" stroke-width="6"/>${seg}<text x="21" y="20.5" text-anchor="middle" font-size="4.2" font-weight="700" fill="var(--ink)">${f(tot)}</text><text x="21" y="25.5" text-anchor="middle" font-size="2.8" fill="var(--mute)">บาท</text></svg><div class="leg">${ks.slice(0,6).map((k,i)=>`<div><i style="background:${COL[i%8]}"></i><span>${ic(k)} ${esc(k)}</span><b>${Math.round(by[k]/tot*100)}%</b></div>`).join('')}</div></div></div>`}
function bars(p){const ms=[];let y=+M.slice(0,4),m=+M.slice(5);for(let i=0;i<6;i++){ms.unshift(y+'-'+String(m).padStart(2,'0'));m--;if(!m){m=12;y--}}
const d=ms.map(k=>{const l=inM(p,k);return[k,sum(l,'i'),sum(l,'e')]});const mx=Math.max(1,...d.map(x=>Math.max(x[1],x[2])));
if(d.every(x=>!x[1]&&!x[2]))return emptyBox('ยังไม่มีข้อมูลเปรียบเทียบ','เพิ่มรายการแล้วกราฟ 6 เดือนจะขึ้นที่นี่',0);
return `<div class="card"><div class="bars" role="img" aria-label="กราฟรายรับเทียบรายจ่าย 6 เดือน">${d.map(x=>`<div class="${x[0]==M?'on':''}"><div class="p"><i class="a" style="height:${x[1]/mx*100}%" title="รายรับ ${f(x[1])}"></i><i class="b" style="height:${x[2]/mx*100}%" title="รายจ่าย ${f(x[2])}"></i></div>${TM[+x[0].slice(5)-1]}</div>`).join('')}</div><div class="key"><span><i style="background:var(--inc)"></i>รายรับ</span><span><i style="background:var(--exp)"></i>รายจ่าย (ลายเส้น)</span></div></div>`}

function home(){const p=P(),l=inM(p,M),i=sum(l,'i'),e=sum(l,'e'),bal=p.o+sum(p.tx,'i')-sum(p.tx,'e'),rate=i?Math.round((i-e)/i*100):0;

// ---------- เข้ารหัส + คลาวด์ ----------
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyOf(pin,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(salt),iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,enc.encode(JSON.stringify(o)))),r=new Uint8Array(12+ct.length);r.set(iv);r.set(ct,12);return b64(r)}
async function unseal(s){const r=ub(s);return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(0,12)},KEY,r.slice(12))))}
const byId=(a,b)=>a.id-b.id,ymOf=x=>x.d.slice(0,7);
async function sync(){
  if(!A||!KEY||!DB)return;
  if(syncing){dirty=true;return}
  syncing=true;dirty=false;setSync('☁️ กำลังบันทึก…');let bad=false;
  try{
    const id=A.id,upd={},core=JSON.stringify({o:A.o,b:A.b,g:A.g}),meta=JSON.stringify({n:A.n,e:A.e,c:A.c,ph:A.ph||''});let ct=null;
    if(core!==W.core){ct=await seal(JSON.parse(core));upd.core=ct}
    if(meta!==W.meta)Object.assign(upd,JSON.parse(meta));
    if(Object.keys(upd).length){await DB.doc('profiles/'+id).update(upd);if(ct){W.core=core;CT.core=ct}W.meta=meta}
    const by={};A.tx.forEach(x=>{(by[ymOf(x)]=by[ymOf(x)]||[]).push(x)});
    Object.keys(W).filter(k=>k.startsWith('m:')).forEach(k=>{if(!by[k.slice(2)])by[k.slice(2)]=[]});
    for(const ym of Object.keys(by)){const arr=by[ym].sort(byId),j=JSON.stringify(arr),k='m:'+ym;
      if(W[k]===j||(!arr.length&&W[k]===undefined))continue;
      const c2=await seal(arr);await DB.doc('profiles/'+id+'/months/'+ym).set({d:c2});W[k]=j;CT[k]=c2}
    setSync('☁️ บันทึกแล้ว');
  }catch(e){bad=true;dirty=true;setSync('⚠️ บันทึกไม่ได้ จะลองใหม่')}
  syncing=false;
  if(dirty){clearTimeout(st);st=setTimeout(sync,bad?5000:300)}
}
function subMonths(id){return new Promise(res=>{let first=true;
  unM=DB.collection('profiles/'+id+'/months').onSnapshot(async snap=>{
    try{
      if(first){first=false;A.tx=[];for(const d of snap.docs){const ct=d.data().d,k='m:'+d.id;try{const arr=await unseal(ct);A.tx.push(...arr);W[k]=JSON.stringify(arr.slice().sort(byId));CT[k]=ct}catch(e){}}res();return}
      let ch=false;
      for(const c of snap.docChanges()){const ym=c.doc.id,k='m:'+ym,mine=A.tx.filter(x=>ymOf(x)==ym).sort(byId);
        if(JSON.stringify(mine)!==(W[k]===undefined?'[]':W[k]))continue;
        if(c.type=='removed'){A.tx=A.tx.filter(x=>ymOf(x)!=ym);delete W[k];delete CT[k];ch=true;continue}
        const ct=c.doc.data().d;if(CT[k]===ct)continue;
        const arr=await unseal(ct);A.tx=A.tx.filter(x=>ymOf(x)!=ym).concat(arr);W[k]=JSON.stringify(arr.slice().sort(byId));CT[k]=ct;ch=true}
      if(ch&&A){render();setSync('☁️ อัปเดตล่าสุดจากอุปกรณ์อื่นแล้ว')}
    }catch(e){res()}
  },()=>res())})}

async function login(pid,pin){
  const m=PL.find(x=>x.id==pid);if(!m)return false;
  KEY=await keyOf(pin,m.salt);let core;
  try{core=await unseal(m.core)}catch(e){KEY=null;return false}
  A={id:pid,n:m.n,e:m.e,c:m.c,ph:m.ph||'',o:core.o||0,b:core.b||{},g:core.g||[],tx:[]};
  W={core:JSON.stringify({o:A.o,b:A.b,g:A.g}),meta:JSON.stringify({n:A.n,e:A.e,c:A.c,ph:A.ph})};CT={core:m.core};dirty=false;
  await subMonths(pid);UI.last=pid;saveUI();enter();return true}
async function createProfile(o){
  const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),salt=b64(crypto.getRandomValues(new Uint8Array(16)));

  await DB.doc('profiles/'+id).set({n:o.n,e:o.e,c:o.c,ph:o.ph||'',salt:salt,core:ct});
  PL=PL.filter(x=>x.id!=id).concat({id:id,n:o.n,e:o.e,c:o.c,ph:o.ph||'',salt:salt,core:ct});
  if(!await login(id,o.pin))throw 0}

open(`<button class="btn s full" id="slip" style="margin:0 0 10px">📷 สแกนสลิปโอนเงิน (ให้ Claude อ่าน)</button><div class="seg" id="seg"><button data-t="e" class="on">รายจ่าย</button><button data-t="i">รายรับ</button></div><div class="big" id="big" aria-live="polite">฿0</div><div class="cats" id="cats"></div><div class="pad" id="pad"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="nt" placeholder="โน้ต (ไม่บังคับ)" style="margin:0;flex:1.3" maxlength="40" aria-label="โน้ต"><input id="dd" type="date" value="${dt}" style="margin:0;flex:1" aria-label="วันที่"></div><button class="btn full" id="ok">บันทึกรายการ</button>`);
const cs=()=>{const l=type=='e'?CE:CI;if(!l.some(c=>c[1]==cat))cat=l[0][1];$('#cats').innerHTML=l.map(c=>`<button data-c="${c[1]}" class="${c[1]==cat?'on':''}">${c[0]} ${c[1]}</button>`).join('');document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;cs()})};cs();
$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<button data-k="${k}" aria-label="${k=='⌫'?'ลบ':k}">${k}</button>`).join('');
document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='⌫')amt=amt.slice(0,-1);else if(k=='.'){if(amt&&!amt.includes('.'))amt+='.'}else if(amt.length<10&&!(amt.includes('.')&&amt.split('.')[1].length>=2))amt+=k;amt=amt.replace(/^0+(?=\d)/,'');bigT()});
$('#slip').onclick=()=>slipScan(cs);
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x==b));cs()});
$('#ok').onclick=()=>{if(!amt){toast('ใส่จำนวนเงินก่อนบันทึก');return}const d=$('#dd').value||iso(new Date());if(sref&&P().tx.some(x=>x.ref==sref)){toast('สลิปนี้เคยบันทึกแล้ว');return}P().tx.push({id:Date.now(),t:type,c:cat,n:$('#nt').value.trim()||cat,a:+amt,d,ref:sref});save();M=d.slice(0,7);close();render();toast('บันทึกรายการแล้ว')}}
$('#addBtn').onclick=()=>{if(A)addSheet()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();if(A&&dirty)sync()}else if(A&&hid&&Date.now()-hid>300000)lock()});
window.addEventListener('beforeunload',e=>{if(dirty||syncing){e.preventDefault()}});
(async()=>{
  gate('load');
  try{DB=window.claude?await claude.use('db'):null}catch(e){DB=null}
  if(!DB){gate('nodb');return}
  setTimeout(()=>{if(GS=='load')gate('nodb')},15000);
  DB.collection('profiles').onSnapshot(snap=>{
    PL=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!A){if(GS=='load'||GS=='welcome')gate('welcome');return}
    const m=PL.find(x=>x.id==A.id);if(!m||dirty||syncing)return;
    const mj=JSON.stringify({n:m.n,e:m.e,c:m.c,ph:m.ph||''});let ch=false;
    if(mj!==W.meta){A.n=m.n;A.e=m.e;A.c=m.c;A.ph=m.ph||'';W.meta=mj;ch=true}
    if(m.core&&m.core!==CT.core){unseal(m.core).then(c=>{A.o=c.o||0;A.b=c.b||{};A.g=c.g||[];W.core=JSON.stringify({o:A.o,b:A.b,g:A.g});CT.core=m.core;render()}).catch(()=>{})}
    if(ch)render()
  },()=>gate('nodb'));
})();
</script>
